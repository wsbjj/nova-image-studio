services:
  nova-image-studio-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        NODE_IMAGE: ${NOVA_DEV_NODE_IMAGE:-node:22-slim}
    container_name: nova-image-studio-dev
    working_dir: /app
    command: >
      sh -c "test -d frontend/node_modules/next || npm --prefix frontend ci;
      test -d backend/node_modules/better-sqlite3 || npm --prefix backend ci;
      NODE_ENV=development
      HOSTNAME=0.0.0.0
      PORT=3000
      NOVA_TASK_DB=/app/backend/data/nova-tasks.sqlite
      NOVA_IMAGE_DIR=/app/backend/data/nova-images
      node backend/server.js"
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      HOSTNAME: 0.0.0.0
      PORT: 3000
      NOVA_TASK_DB: /app/backend/data/nova-tasks.sqlite
      NOVA_IMAGE_DIR: /app/backend/data/nova-images
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    env_file:
      - path: ./.env
        required: false
    volumes:
      - ./:/app
      - frontend_node_modules:/app/frontend/node_modules
      - backend_node_modules:/app/backend/node_modules
      - ./data:/app/backend/data
    restart: unless-stopped

volumes:
  frontend_node_modules:
  backend_node_modules:
